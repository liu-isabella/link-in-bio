<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <style>
    /*
    * {
      border: 1px red dashed;
    }
    */
    html {
    min-height: 100%;
    }
    .avatar-image {
      width: 128px;
      height: 128px;
      object-fit: cover;
      border-radius: 128px;
    }
    .thumbnail {
    width: 48px;
    height: 48px;
    border-radius: 48px;
    object-fit: cover;
    }
    .image-row {
    margin-bottom: 20px;
    text-align: center;
    }
    .name-row {
      margin-bottom: 30px;
      text-align: center;
      font-family: "Playwrite AU SA";
      font-size: 24px;
      font-weight: 900;
    }
    .social-icons-row {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
    }
    .item {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      border-radius: 1000px;
      padding: 5px;
      padding-right: 53px;
      box-shadow: 4px 4px 10px 0px rgba(122,32,122,0.5);
    }
    .link-text {
      text-align: center;
      flex-grow: 1;
    }
    .main-container {
    max-width: 640px;
    margin: auto;
    }
    body {
      min-height: 100%;
      padding-top: 40px;
      padding-bottom: 40px;
      background: linear-gradient(210deg, #059bff, #73b3ff, #a8ccff, #d5e5ff, #ffffff);
      color: rgba(193, 0, 100, 0.8);
      font-family: "Poppins";
      }
      a {
      color: rgba(154, 12, 85, 0.8);
      text-decoration: none;
      }
      .item {
      background-color: rgba(149, 123, 173, 0.5);
      }
</style>
</head>
<body>
  <div class="main-container">
    <div class="image-row">
      <img class="avatar-image" src="/animalpic.jpeg" alt="Profile Photo">
    </div>

    <div class="name-row">
      Isabella Liu
    </div>

    <div class="social-icons-row">
      <a href="https://www.instagram.com/liusabella/" target="_blank">
        <i class="fa-brands fa-instagram"></i> 
      </a>
      <a href="https://www.facebook.com/liusabella/" target="_blank">
        <i class="fa-brands fa-facebook"></i> 
      </a>
      <a href="https://www.linkedin.com/in/liuisabella/" target="_blank">
        <i class="fa-brands fa-linkedin"></i> 
      </a>
    </div>

    <div class="links-row">
      <div class="item">
        <img class="thumbnail" src="/InstaIcon.png">

        <a class="link-text" target="_blank" href="https://www.instagram.com/p/DELcZ4bMnW0/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==">
          Funny Instagram Post
        </a>
      </div>

      <div class="item">
        <img class="thumbnail" src="/GoogleMapsIcon.png">

        <a class="link-text" target="_blank" href="https://maps.app.goo.gl/uj77HSsab37QtuHN6">
          Chicago Restaurants I Want To Try
        </a>
      </div>
    </div>
  </body>
